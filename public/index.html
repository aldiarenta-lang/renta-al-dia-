<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102945">
    <meta name="description" content="Dashboard de Renta al Día. Administra información y consulta reportes desde un solo lugar.">
    <title>Renta al Día | Dashboard</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell" id="operator-app">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/" aria-label="Renta al Día, Dashboard">
          <img src="/assets/logo.jpeg" alt="Logotipo de Renta al Día">
          <span class="brand-copy">
            <strong>RENTA <span>AL DÍA</span></strong>
            <small>Declaraciones de renta</small>
          </span>
        </a>
        <div class="nav-caption">ESPACIO DE TRABAJO</div>
        <nav id="main-navigation" aria-label="Navegación principal"></nav>
        <div class="sidebar-footer">
          <span class="connection-dot" id="connection-dot"></span>
          <span id="connection-label">Conectando con PostgreSQL…</span>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <button class="icon-button menu-toggle" id="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div class="breadcrumb"><span>Renta al Día</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-title">Tablero</strong></div>
          <div class="topbar-actions">
            <span class="year-chip" id="year-chip">Año sin configurar</span>
            <a class="settings-shortcut" href="/configuracion" aria-label="Configurar empresa">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 15 .1.1a1.8 1.8 0 1 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .9v.2a1.8 1.8 0 1 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.9l-.1.1a1.8 1.8 0 1 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.9-3h-.2a1.8 1.8 0 1 1 0-3.6h.2a1.8 1.8 0 0 0 .9-3l-.1-.1a1.8 1.8 0 1 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.9v-.2a1.8 1.8 0 1 1 3.6 0v.2a1.8 1.8 0 0 0 3 .9l.1-.1a1.8 1.8 0 1 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .9 3h.2a1.8 1.8 0 1 1 0 3.6h-.2a1.8 1.8 0 0 0-.9 3Z"/></svg>
            </a>
          </div>
        </header>
        <main id="main-content" tabindex="-1" aria-live="polite"></main>
        <footer class="app-footer">Renta al Día <span>·</span> Información almacenada en PostgreSQL</footer>
      </div>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div class="modal-layer" id="modal-layer" hidden></div>
  </body>
</html>
